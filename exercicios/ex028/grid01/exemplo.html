<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout na prática</title>
    <style>
      .container {
        border: 3px solid blue;
        height: auto;
        display: grid;
        grid-template: repeat(3, 80px) /*(3, 80px) = 80px 80px 80px */ / repeat(
            3,
            1fr
          ); /* (3, auto) = auto auto auto */ /* primeiro (grid-template-rows) / depois (grid-template-columns) */
        gap: 10px;
        place-items: stretch stretch; /* primeiro (align-items) / depois (justify-items) */
        place-content: stretch stretch; /* primeiro (align-content) / depois (justify-content) */
      }

      .item {
        border: 3px solid red;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
      <div class="item">H</div>
    </div>
  </body>
</html>
